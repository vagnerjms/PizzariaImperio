services:
  db:
    image: mongo:6.0
    container_name: pizzaria_db
    restart: always
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
    volumes:
      - mongo_data:/data/db
    mem_limit: 1024m
    mem_reservation: 512m

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3002:8080"
    depends_on:
      - db
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DOCKER=true
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    env_file:
      - .env
    mem_limit: 1024m
    mem_reservation: 512m

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: pizzaria_evolution
    restart: always
    ports:
      - "8085:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8085
      - SERVER_TYPE=http
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@postgres:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=false
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=pizzaria_evolution_secret_key_2026
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - db
      - postgres
    mem_limit: 1536m
    mem_reservation: 768m

  postgres:
    image: postgres:15-alpine
    container_name: pizzaria_postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    mem_reservation: 256m

volumes:
  mongo_data:
  evolution_instances:
  postgres_data:
