services:
  db:
    image: mongo:6.0
    container_name: pizzaria_db
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    mem_limit: 768m
    mem_reservation: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3002:8080"
    depends_on:
      - db
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DOCKER=true
    env_file:
      - .env
    mem_limit: 1536m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: pizzaria_evolution
    restart: always
    ports:
      - "8085:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=${EVOLUTION_API_URL:-http://localhost:8085}
      - SERVER_TYPE=http
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-evolution}?schema=public
      - CACHE_REDIS_ENABLED=false
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?Set EVOLUTION_API_KEY in .env}
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - db
      - postgres
    mem_limit: 1024m
    mem_reservation: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    container_name: pizzaria_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-evolution}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 384m
    mem_reservation: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  evolution_manager:
    image: evoapicloud/evolution-manager:latest
    container_name: pizzaria_evolution_manager
    restart: always
    ports:
      - "8086:80"
    environment:
      - VITE_EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://localhost:8085}
      - VITE_EVOLUTION_API_KEY=${EVOLUTION_API_KEY:?Set EVOLUTION_API_KEY in .env}
      - VITE_APP_NAME=Evolution Manager - Pizzaria Império
    depends_on:
      - evolution_api
    mem_limit: 256m
    mem_reservation: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data:
  evolution_instances:
  postgres_data:
